name: Release

on:
  push:
    tags: ['v*']
  # For publishing from main without pushing a tag first; the release step
  # creates the tag on the commit it built.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # With the PETIT_COIN_KEYSTORE_BASE64 secret set, builds are signed with
      # the upload key and an AAB for Google Play is attached too.
      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PETIT_COIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "PETIT_COIN_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          PETIT_COIN_KEYSTORE_PASSWORD: ${{ secrets.PETIT_COIN_KEYSTORE_PASSWORD }}
          PETIT_COIN_KEY_ALIAS: ${{ secrets.PETIT_COIN_KEY_ALIAS }}
          PETIT_COIN_KEY_PASSWORD: ${{ secrets.PETIT_COIN_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "petit-coin-${TAG}.apk"
          if [ "$SIGNED" = true ]; then
            flutter build appbundle --release
            cp build/app/outputs/bundle/release/app-release.aab "petit-coin-${TAG}.aab"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          body_path: RELEASE_NOTES.md
          files: |
            petit-coin-${{ env.TAG }}.apk
            petit-coin-${{ env.TAG }}.aab
          fail_on_unmatched_files: false
