name: Release

on:
  push:
    tags: ['v*']
  # For publishing from main without pushing a tag first; the release step
  # creates the tag on the commit it built.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create, e.g. v0.1.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk "petit-coin-${TAG}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ startsWith(env.TAG, 'v0.') }}
          body_path: RELEASE_NOTES.md
          files: petit-coin-${{ env.TAG }}.apk
